<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0b12" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <title>Wimmelstadt: the look</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0b12;
        color: #f2efe6;
        font: 13px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }
      #c {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      #c:active { cursor: grabbing; }

      #ui {
        position: fixed;
        left: 50%;
        bottom: calc(14px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px 12px;
        padding: 8px 14px;
        border-radius: 22px;
        background: rgba(14, 14, 22, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.12);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        transition: opacity 0.6s ease;
        max-width: calc(100vw - 24px);
        box-sizing: border-box;
      }
      body.idle #ui, body.idle #hint { opacity: 0; pointer-events: none; }
      #time {
        font-variant-numeric: tabular-nums;
        font-weight: 650;
        font-size: 15px;
        min-width: 44px;
        text-align: center;
      }
      #dial {
        width: min(38vw, 360px);
        accent-color: #ff3d9a;
        margin: 0;
      }
      button {
        font: inherit;
        color: inherit;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        padding: 4px 11px;
        cursor: pointer;
        white-space: nowrap;
      }
      button.on { background: #ff3d9a; border-color: #ff3d9a; color: #14141c; font-weight: 650; }
      .glyph { opacity: 0.75; font-size: 14px; }

      #hud {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top));
        left: calc(10px + env(safe-area-inset-left));
        margin: 0;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(14, 14, 22, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.12);
        font: 11px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace;
        display: none;
        pointer-events: none;
        white-space: pre;
      }
      #hud.on { display: block; }

      #hint {
        position: fixed;
        top: calc(12px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        padding: 5px 12px;
        border-radius: 999px;
        background: rgba(14, 14, 22, 0.5);
        font-size: 12px;
        opacity: 0.85;
        transition: opacity 0.6s ease;
        pointer-events: none;
        white-space: nowrap;
      }
      @media (max-width: 720px) {
        #hint { display: none; }
        #ui { gap: 8px; padding: 7px 10px; }
        .wide { display: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hint">drag to move · right-drag or two fingers to turn · wheel or pinch to zoom</div>
    <pre id="hud"></pre>
    <div id="ui">
      <span class="glyph">☀</span>
      <span id="time">12:00</span>
      <input id="dial" type="range" min="0" max="24" step="0.01" value="12" aria-label="Time of day" />
      <span class="glyph">☾</span>
      <button id="live" title="Follow the clock (L)">live</button>
      <button id="follow" title="Ride along with a hero (F)">follow</button>
      <button id="weather" title="The weather: the city's own, or one of six kinds (W)">weather</button>
      <button id="focus" class="wide" title="How shallow the focus is (B)">focus</button>
      <button id="lapse" class="wide" title="Run a whole day in 80 seconds (T)">time-lapse</button>
      <button id="stats" class="wide" title="Frame time and draw calls (S)">stats</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
