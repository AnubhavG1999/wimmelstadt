<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wimmelstadt: the hero trial</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #16171c; color: #e8e6e1; font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
      #app { display: grid; grid-template-rows: auto auto 1fr; height: 100%; }
      header { display: flex; gap: 10px 14px; align-items: center; padding: 10px 16px; border-bottom: 1px solid #2a2c35; flex-wrap: wrap; }
      header h1 { font-size: 16px; margin: 0; }
      .muted { color: #9a9ca8; }
      .grow { flex: 1; }
      #pictures { display: flex; gap: 10px; padding: 8px 16px; overflow-x: auto; border-bottom: 1px solid #2a2c35; }
      #pictures figure { margin: 0; flex: none; }
      #pictures img { height: 116px; display: block; border-radius: 6px; background: #fff; }
      #pictures figcaption { color: #9a9ca8; font-size: 12px; margin-top: 2px; }
      #stage { position: relative; min-height: 0; touch-action: none; }
      #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #cells { position: absolute; inset: 0; display: grid; pointer-events: none; }
      .cell { position: relative; border: 1px solid #2a2c35; min-width: 0; min-height: 0; }
      .cell .tag { position: absolute; left: 10px; top: 8px; right: 10px; font-size: 13px; text-shadow: 0 1px 2px #000; }
      .cell .tag b { font-weight: 600; font-size: 14px; }
      .cell .tag div { color: #b9bbc6; }
      .cell .note { position: absolute; inset: 0; display: grid; place-items: center; padding: 48px 24px; text-align: center; color: #d9a05b; }
      .cell button { pointer-events: auto; position: absolute; right: 10px; bottom: 10px; }
      button, select { font: inherit; color: inherit; background: #2a2c35; border: 1px solid #3a3d49; border-radius: 999px; padding: 3px 12px; cursor: pointer; }
      button[aria-pressed="true"] { background: #ff3d9a; border-color: #ff3d9a; color: #16171c; }
      #empty { position: absolute; inset: 0; display: grid; place-items: center; color: #9a9ca8; text-align: center; padding: 24px; white-space: pre-line; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1 id="title">The hero trial</h1>
        <span id="sub" class="muted"></span>
        <span class="grow"></span>
        <select id="pick" title="Which capture to show"></select>
        <button id="spin" aria-pressed="true" title="Turn the models slowly">spin</button>
        <button id="city" aria-pressed="false" title="Look from the angle the city is seen from">city angle</button>
        <button id="look" aria-pressed="false" title="Draw the models as the city would: flat colour, banded light and an outline">city look</button>
        <button id="plain" aria-pressed="false" title="Hide the textures, to judge the shape alone">shape only</button>
      </header>
      <div id="pictures"></div>
      <div id="stage">
        <canvas id="c"></canvas>
        <div id="cells"></div>
        <div id="empty" hidden></div>
      </div>
    </div>
    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
