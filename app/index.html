<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0b12" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <title>Wimmelstadt</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0b12;
        color: #f2efe6;
        font: 13px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }
      #c {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      #c:active { cursor: grabbing; }

      /* The controls: things of brass lying beside the tiles. They are built by
         src/ui/controls.ts, and are out of sight until the screen is touched. */
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        transition: opacity 0.6s ease;
        --brass: radial-gradient(circle at 35% 28%, #f3dc9a, #c9a352 58%, #8c6a2a);
        --ink: #3a2a10;
        --edge: #6e531f;
      }
      body.idle #ui, body.idle #hint { opacity: 0; }
      #ui button, #ui .dial { pointer-events: auto; }
      body.idle #ui button, body.idle #ui .dial { pointer-events: none; }

      /* The plates at the top left, like the plates on the tiles: one says where the
         view is, and a second one names the hero it is following. */
      .plates {
        position: absolute;
        top: calc(14px + env(safe-area-inset-top));
        left: calc(16px + env(safe-area-inset-left));
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .plate {
        padding: 7px 16px 6px 18px;
        border-radius: 3px;
        background: linear-gradient(#e6cb80, #c9a352 52%, #a8833c);
        border: 1px solid rgba(60, 42, 14, 0.65);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 244, 205, 0.6);
        color: var(--ink);
        font: 700 14px/1.2 Georgia, "Times New Roman", serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        text-shadow: 0 1px 0 rgba(255, 236, 176, 0.65);
        white-space: nowrap;
      }
      .plate-hero {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 5px 13px 5px 10px;
        font-size: 11.5px;
        letter-spacing: 0.14em;
      }
      .plate-hero[hidden] { display: none; }
      .plate-hero svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round; flex: none; }

      /* the dial, with the weather tokens fanned round its upper left and the keys beside it */
      .cluster {
        position: absolute;
        right: calc(18px + env(safe-area-inset-right));
        bottom: calc(18px + env(safe-area-inset-bottom));
        width: 132px;
        height: 132px;
        transform-origin: bottom right;
      }
      .dial {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
        touch-action: none;
        outline: none;
        filter: drop-shadow(0 3px 7px rgba(0, 0, 0, 0.5));
      }
      .dial text { font-family: Georgia, "Times New Roman", serif; text-anchor: middle; pointer-events: none; }
      .dial .time { font-size: 13.5px; font-weight: 700; fill: var(--ink); }
      .dial .state { font: 700 4.8px system-ui, sans-serif; letter-spacing: 0.16em; fill: #7a5a22; }
      .dial.is-live .state { fill: #b3261e; }
      .dial .num { font-size: 7px; font-weight: 700; }
      .num-day { fill: #5b4a1c; }
      .num-night { fill: #c9d0f5; }
      .tick-day { stroke: #5b4a1c; stroke-width: 0.8; opacity: 0.7; }
      .tick-night { stroke: #c9d0f5; stroke-width: 0.8; opacity: 0.6; }
      .mark .sun circle { fill: #ffd34d; stroke: #a86f00; stroke-width: 0.9; }
      .mark .sun path { stroke: #c98a00; stroke-width: 1.1; stroke-linecap: round; fill: none; }
      .mark .moon circle { fill: #eef1ff; stroke: #7c86b8; stroke-width: 0.8; }
      .mark .moon .bite { fill: #1c2152; stroke: none; }
      .mark .moon { display: none; }
      .dial.is-night .mark .sun { display: none; }
      .dial.is-night .mark .moon { display: block; }

      .token, .key {
        position: absolute;
        border-radius: 50%;
        border: 1px solid var(--edge);
        background: var(--brass);
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 244, 205, 0.55);
        color: var(--ink);
        padding: 0;
        cursor: pointer;
        display: grid;
        place-items: center;
      }
      .token svg, .key svg {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* six tokens on a quarter circle, from the dial's left round to its top */
      .token {
        left: 50%;
        top: 50%;
        width: 30px;
        height: 30px;
        margin: -15px;
        --a: calc(183deg + var(--i) * 17.4deg);
        transform: translate(calc(cos(var(--a)) * 92px), calc(sin(var(--a)) * 92px));
      }
      .token.on, .key.on {
        background: radial-gradient(circle at 35% 28%, #fffdf5, #f3e7c4 60%, #d9c58f);
        box-shadow: 0 0 0 2px #b3261e, 0 2px 6px rgba(0, 0, 0, 0.5);
      }
      /* a dot under the weather the city has chosen for itself */
      .token.now::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: -7px;
        width: 5px;
        height: 5px;
        margin-left: -2.5px;
        border-radius: 50%;
        background: #f3dc9a;
        box-shadow: 0 0 0 1px var(--edge);
      }
      .keys { position: absolute; right: calc(100% + 30px); bottom: 0; display: flex; gap: 8px; }
      .key { position: static; width: 28px; height: 28px; }
      .key svg { width: 17px; height: 17px; }
      .key[data-k="lapse"] svg, .key[data-k="more"] svg { fill: currentColor; stroke: none; }
      .key[hidden] { display: none; }
      /* the options: a card with a brass edge, a row for each setting */
      .options {
        position: absolute;
        right: calc(100% + 54px);
        bottom: 40px;
        width: 214px;
        display: none;
        padding: 4px 0 5px;
        border-radius: 9px;
        background: linear-gradient(#fbf4de, #f1e5c2);
        border: 1px solid var(--edge);
        box-shadow: 0 0 0 2px #c9a352, 0 0 0 3px var(--edge), 0 6px 16px rgba(0, 0, 0, 0.45);
        color: var(--ink);
      }
      .cluster.open .options { display: block; }
      .options-title {
        padding: 6px 14px 5px;
        font: 700 10.5px/1.2 Georgia, "Times New Roman", serif;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #7a5a22;
      }
      .options button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        padding: 7px 12px 7px 14px;
        border: 0;
        border-top: 1px solid rgba(110, 83, 31, 0.22);
        background: none;
        color: inherit;
        font: 13px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: left;
        cursor: pointer;
      }
      .options button:hover { background: rgba(201, 163, 82, 0.2); }
      .options b {
        min-width: 34px;
        padding: 2px 9px;
        border-radius: 999px;
        border: 1px solid rgba(110, 83, 31, 0.45);
        background: rgba(255, 255, 255, 0.55);
        font-weight: 600;
        font-size: 12px;
        text-align: center;
      }
      .options b.on { background: var(--brass); border-color: var(--edge); }

      #hud {
        position: fixed;
        top: calc(64px + env(safe-area-inset-top));
        left: calc(16px + env(safe-area-inset-left));
        margin: 0;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(14, 14, 22, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.12);
        font: 11px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace;
        display: none;
        pointer-events: none;
        white-space: pre;
      }
      #hud.on { display: block; }

      #hint {
        position: fixed;
        bottom: calc(14px + env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        padding: 5px 12px;
        border-radius: 999px;
        background: rgba(14, 14, 22, 0.5);
        font-size: 12px;
        opacity: 0.85;
        transition: opacity 0.6s ease;
        pointer-events: none;
        white-space: nowrap;
      }
      @media (max-width: 900px), (max-height: 520px) {
        #hint { display: none; }
        .cluster { transform: scale(0.82); }
        .plate { padding: 5px 12px 4px 14px; font-size: 12px; }
        .plate-hero { padding: 4px 11px 4px 8px; font-size: 10.5px; }
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hint">Drag to move · Right-drag or two fingers to rotate · Scroll or pinch to zoom · Double-click a tile to visit it</div>
    <pre id="hud"></pre>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
